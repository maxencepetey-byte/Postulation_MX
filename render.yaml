services:
  - type: web
    name: mx-project
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python MX_Project/manage.py collectstatic --noinput && python MX_Project/manage.py migrate
    startCommand: gunicorn MX_Project.wsgi:application --chdir MX_Project
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "mx-project.onrender.com"

  # Cron Job : sync du registre SITG toutes les 24h (3h du matin, heure Suisse = 1h UTC)
  - type: cron
    name: mx-sync-registre
    env: python
    plan: free
    schedule: "0 1 * * *"   # 01:00 UTC = 03:00 Europe/Zurich (heure d'été)
    buildCommand: pip install -r requirements.txt
    # --mx_only : Render bloque le port 25 sortant, la vérification SMTP n'aboutirait jamais.
    startCommand: python MX_Project/manage.py sync_registre --mx_only
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      # Render ne partage PAS les variables du service web avec le cron.
      # La synchro ne signe rien : une clé propre au cron suffit, inutile de recopier celle du site.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Sans elle, la commande écrit dans un SQLite vide et jetable.
      # Valeur à saisir à la main dans l'onglet Environment du cron (même que le service web).
      - key: DATABASE_URL
        sync: false
